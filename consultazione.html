<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EWC · Classifiche e risultati</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#15314a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}header{background:#042a4b;color:white;padding:25px 16px;text-align:center}header h1{font-size:clamp(21px,5vw,32px);margin:0 0 5px}header p{margin:0;color:#d5e6f4}main{max-width:920px;margin:auto;padding:18px 13px 45px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}.choice{border:0;border-radius:16px;min-height:115px;color:white;font-size:clamp(19px,4vw,27px);font-weight:800;cursor:pointer;box-shadow:0 3px 9px #0002}.choice:focus-visible,button:focus-visible{outline:3px solid #2687e9;outline-offset:3px}.gold{background:#6a4d00}.silver{background:#465361}.bronze{background:#6b3a1c}.femm{background:#74204a}.bar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}.btn{border:1px solid #b7c7d5;background:white;border-radius:11px;padding:11px 14px;color:#042a4b;font-weight:700;cursor:pointer}.card{background:white;border:1px solid #dce5ed;border-radius:14px;margin:14px 0;padding:15px;overflow:hidden}.card h2{margin:0 0 10px;font-size:19px}.card h3{margin:16px 0 8px;font-size:16px}.muted{color:#5e7080;font-size:13px}.status{padding:14px;background:white;border-radius:12px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 5px;border-bottom:1px solid #e7edf1;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}td:nth-child(2){font-weight:600;overflow-wrap:anywhere}th{background:#edf3f7}.match{padding:12px 0;border-top:1px solid #e6edf2}.teams{font-weight:650;overflow-wrap:anywhere}.score{font-weight:800;color:#042a4b;margin-top:5px}.small{font-size:12px;color:#687b89}section[hidden],div[hidden]{display:none!important}@media(max-width:430px){.choice{min-height:100px}table{font-size:12px}th,td{padding:8px 3px}}
</style></head><body><header><h1>ELBA WINTER CHAMPIONSHIP</h1><p>Classifiche e risultati ufficiali</p></header><main><div id="intro"><p>Seleziona una categoria per consultare classifiche e risultati dei gironi.</p><div class="choices" id="choices"></div></div><div id="detail" hidden><div class="bar"><button class="btn" id="back" type="button">← Tutte le categorie</button><button class="btn" id="copy" type="button">Copia link</button></div><h2 id="heading"></h2><p class="muted" id="updated"></p><div id="groups"></div></div><div id="status" class="status" role="status">Caricamento dati pubblici…</div></main>
<script>
'use strict';
const API="https://script.google.com/macros/s/AKfycbz6EOiYGBXS22TpGYIycFLzuwULBN2E6ASrXN0lHOyqowaqtEngX7FivR6xRjOmYrAK/exec";
const CATS=[['GOLD','Gold','gold'],['SILVER','Silver','silver'],['BRONZE','Bronze','bronze'],['FEMM','Femminile','femm']];
let data=null;
const $=id=>document.getElementById(id);
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined&&txt!==null)n.textContent=String(txt);if(cls)n.className=cls;return n}
function fmtScore(m){const s=m.score;if(!s)return 'Risultato non disponibile';const parts=(s.sets||[]).map(x=>Array.isArray(x)?x.join('–'):'').filter(Boolean);if(Array.isArray(s.stb))parts.push('STB '+s.stb.join('–'));return parts.join(' · ')||'Risultato registrato'}
function card(parent,heading){const s=el('section',null,'card');s.append(el('h2',heading));parent.append(s);return s}
function show(){const key=decodeURIComponent(location.hash.slice(1)).toUpperCase();const cat=CATS.find(c=>c[0]===key);$('intro').hidden=!!cat;$('detail').hidden=!cat;if(!cat)return;$('heading').textContent=cat[1].toUpperCase();$('groups').replaceChildren();if(!data){$('updated').textContent='Caricamento…';return}const t=(data.tournaments||[]).find(t=>String(t.id).toUpperCase()===key);if(!t){$('updated').textContent='Categoria non disponibile';return}$('updated').textContent='Dati pubblici aggiornati alla consultazione';(t.groups||[]).forEach(g=>{const s=card($('groups'),g.label||'Girone');s.append(el('p',(g.played||0)+' di '+(g.total||0)+' incontri giocati','muted'));s.append(el('h3',g.official?'Classifica':'Riepilogo partite'));const wrap=el('div',null,'scroll'),table=el('table'),thead=el('thead'),tr=el('tr');(g.official?['#','Coppia','G','Pt','DG']:['Coppia','G','V','P']).forEach(h=>tr.append(el('th',h)));thead.append(tr);table.append(thead);const tbody=el('tbody');(g.rows||[]).forEach(r=>{const row=el('tr');const vals=g.official?[r.played? (r.pos==null?'–':r.pos+(r.tied?'=':'')):'–',r.name,r.played,r.pts+(r.ptsPending?'*':''),(r.dg>0?'+':'')+r.dg]:[r.name,r.played,r.won,r.lost];vals.forEach(v=>row.append(el('td',v)));tbody.append(row)});table.append(tbody);wrap.append(table);s.append(wrap);if(g.inVerifica)s.append(el('p','Classifica in verifica: alcune posizioni richiedono conferma del club.','muted'));(g.notes||[]).forEach(n=>s.append(el('p',n,'muted')));const played=(g.matches||[]).filter(m=>m.state==='GIOCATO');s.append(el('h3','Risultati ('+played.length+')'));if(!played.length)s.append(el('p','Nessun risultato registrato.','muted'));played.forEach(m=>{const d=el('div',null,'match');d.append(el('div',(m.a?.name||'Coppia A')+' — '+(m.b?.name||'Coppia B'),'teams'));d.append(el('div',fmtScore(m),'score'));if(m.playedOn)d.append(el('div',m.playedOn,'small'));s.append(d)});});if(!(t.groups||[]).length)$('groups').append(el('p','Nessun girone disponibile.','status'))}
CATS.forEach(c=>{const b=el('button',c[1].toUpperCase(),'choice '+c[2]);b.type='button';b.addEventListener('click',()=>{location.hash=c[0]});$('choices').append(b)});
$('back').addEventListener('click',()=>{history.pushState(null,'',location.pathname+location.search);show();window.scrollTo(0,0)});
$('copy').addEventListener('click',()=>{navigator.clipboard?.writeText(location.href).then(()=>{$('copy').textContent='Link copiato';setTimeout(()=>{$('copy').textContent='Copia link'},2000)}).catch(()=>{prompt('Copia questo link',location.href)})});
window.addEventListener('hashchange',()=>{show();window.scrollTo(0,0)});
async function load(){try{const r=await fetch(API+'?action=snapshot',{credentials:'omit',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error('Dati non disponibili');if(!Array.isArray(j.tournaments))throw Error('Formato dati inatteso');data=j;$('status').hidden=true;show()}catch(e){$('status').hidden=false;$('status').textContent='Impossibile caricare i dati pubblici. Riprova più tardi.';console.error('EWC public snapshot:',e.message)}}
show();load();setInterval(()=>{if(!document.hidden)load()},120000);
</script></body></html>
