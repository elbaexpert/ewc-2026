/*
 * Elba Winter Championship — sistema grafico (mobile-first, base 360–430 px).
 * Idea guida: "il tabellone del campo". I punteggi sono celle da segnapunti blu notte; il resto resta quieto, su carta chiara.
 * 1. Gettoni  2. Base  3. Intestazione e barra  4. Navigazione  5. Superfici  6. Classifica  7. Incontri
 * 8. Home  9. Fase finale  10. Moduli e gestione  11. Stati e movimento  12. Schermi larghi
 */

/* ============ 1. GETTONI ============ */
:root {
  /* Colori del logo ufficiale del Padel Club Portoferraio */
  --navy: #053863; --night: #042a4b; --terra: #b25433; --terra-d: #97432a; --sun: #f8bc3a; --sky: #00adef; --skyl: #91d5e8;
  /* Superfici e testo */
  --paper: #f1f4f8; --card: #ffffff; --ink: #0b2239; --muted: #55657a; --line: #dde5ec; --soft: #e7f0f7; --focus: #0b79b7;
  /* Esiti */
  --ok: #17693f; --ok-bg: #e2f4e9; --warn: #8a4b00; --warn-bg: #fff2d2; --err: #a3231b; --err-bg: #fde8e6; --info-bg: #e7f0f7;
  /* Identità dei quattro tornei */
  --gold: #a87400; --gold-bg: #fdf1d0; --silver: #566574; --silver-bg: #e9eef2; --bronze: #9a4f1d; --bronze-bg: #f8e6d8; --femm: #8a2a6b; --femm-bg: #f6e4ef;
  --tc: var(--navy); --tc-bg: var(--soft);
  /* Forma: tre raggi (superficie, controllo, cella) e due elevazioni */
  --r-l: 18px; --r-m: 12px; --r-s: 8px; --tap: 48px;
  --e1: 0 1px 2px rgba(5,56,99,.05), 0 8px 18px -12px rgba(5,56,99,.22);
  --e2: 0 14px 34px -14px rgba(4,42,75,.45);
  /* Caratteri: titoli e numeri in "EWC Display" (incorporato), testo nel carattere di sistema */
  --display: "EWC Display", "Inter Display", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* retrocompatibilità */
  --brand: var(--navy); --bg: var(--paper); --r: var(--r-m);
}
.t-GOLD { --tc: var(--gold); --tc-bg: var(--gold-bg); } .t-SILVER { --tc: var(--silver); --tc-bg: var(--silver-bg); }
.t-BRONZE { --tc: var(--bronze); --tc-bg: var(--bronze-bg); } .t-FEMM { --tc: var(--femm); --tc-bg: var(--femm-bg); }

/* ============ 2. BASE ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--text); overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--navy); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; } /* il contenitore della pagina riceve il fuoco al cambio vista: nessun riquadro */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, table.st td, .sc .g, .hero-n, .rk, .ptv { font-variant-numeric: tabular-nums; }

/* ============ 3. INTESTAZIONE E BARRA ============ */
.top { position: sticky; top: 0; z-index: 20; background: #fff; color: var(--navy); display: flex; align-items: center; gap: 10px; padding: 6px 10px 9px; min-height: 64px; box-shadow: 0 6px 16px -14px rgba(4,42,75,.5); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--terra) 0 58%, var(--sun) 58% 76%, var(--skyl) 76% 88%, var(--sky) 88% 100%); }
.hlogo { flex: none; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 48px; border-radius: var(--r-s); color: var(--navy); }
.hlogo img { display: block; height: 50px; width: auto; }
.httl { flex: 1; min-width: 0; }
.httl .title { font: 800 17px/1.1 var(--display); letter-spacing: -.015em; color: var(--navy); }
.httl .club { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.25; margin-top: 2px; }
.testpill { background: var(--sun); color: var(--night); font: 800 13px/1.35 var(--display); border-radius: 6px; padding: 0 6px; }
.hbtn { flex: none; min-width: 48px; min-height: 48px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--navy); background: var(--soft); border: 0; border-radius: var(--r-m); text-decoration: none; cursor: pointer; padding: 2px 8px; }
.hbtn.upd { min-width: 60px; font-size: 13px; font-weight: 600; }
.hbtn.upd.alert { background: var(--warn-bg); color: var(--warn); }
.hbtn.upd.busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.bbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 8px; align-items: center; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); padding: 7px 10px calc(7px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 24px -18px rgba(4,42,75,.55); }
.bitem { position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; min-height: 52px; border-radius: var(--r-m); font-weight: 600; transition: transform .12s ease, background-color .12s ease; }
.bitem:active { transform: scale(.97); }
.bitem.side { flex-direction: column; gap: 1px; font-size: 13px; color: var(--navy); }
.bitem.side[aria-current="page"] { background: var(--soft); }
.bitem.main { gap: 8px; background: var(--terra); color: #fff; font: 800 16px/1 var(--display); letter-spacing: -.01em; border-radius: 28px; padding: 4px 12px; white-space: nowrap; box-shadow: 0 8px 18px -8px rgba(178,84,51,.75); }
.bitem.main[aria-current="page"] { background: var(--terra-d); box-shadow: inset 0 0 0 3px var(--sun); }
.bbar.n2 { grid-template-columns: 1fr 1fr; }
.bbar.n2.nomain .bitem.side { flex-direction: row; gap: 8px; font-size: 15px; background: var(--soft); }
.bbar.n3.nomain { grid-template-columns: 1fr 1fr 1fr; }
.bbadge { position: absolute; top: 2px; right: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--terra); color: #fff; font: 800 13px/22px var(--display); text-align: center; box-shadow: 0 0 0 2px #fff; }
.wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px 104px; }

/* ============ 4. NAVIGAZIONE: tornei, gironi, schede ============ */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 6px 16px; border-radius: 24px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; text-decoration: none; cursor: pointer; transition: background-color .12s ease, border-color .12s ease, transform .12s ease; }
.chip:active { transform: scale(.97); }
.chip[aria-current="page"], .chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
/* i quattro tornei: un unico controllo a segmenti */
.chips.four { flex-wrap: nowrap; gap: 4px; background: #fff; border-radius: var(--r-l); padding: 4px; box-shadow: var(--e1); }
.chips.four > * { flex: 1 1 0; min-width: 0; }
.chips.four .chip { width: 100%; padding: 5px 2px 4px; font-size: 14px; white-space: nowrap; border: 0; border-radius: 14px; background: transparent; }
.chips.four .chip[aria-current="page"], .chips.four .chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
.chip.ic { flex-direction: column; gap: 1px; line-height: 1.2; min-height: 56px; }
/* schede di un girone: linea sotto la voce attiva */
.chips.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-bottom: 2px solid var(--line); margin-bottom: 14px; }
.chips.tabs .chip { padding: 6px 4px; font-size: 15px; border: 0; border-radius: 0; background: transparent; color: var(--muted); margin-bottom: -2px; border-bottom: 3px solid transparent; }
.chips.tabs .chip[aria-selected="true"] { background: transparent; color: var(--navy); font-weight: 800; border-bottom-color: var(--terra); }
.chips.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip.col { flex-direction: column; line-height: 1.25; padding: 8px 6px; border-radius: var(--r-m); }
.chip.col[aria-pressed="true"] .sub { color: #fff; }
.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; margin-bottom: 2px; }
.withic { display: flex; align-items: center; gap: 8px; }
.ticon { flex: none; display: block; }

/* ============ 5. SUPERFICI, TITOLI, PULSANTI, MESSAGGI ============ */
.h1 { font: 800 24px/1.12 var(--display); letter-spacing: -.02em; margin: 4px 0 12px; color: var(--night); }
.sec { font: 800 18px/1.2 var(--display); letter-spacing: -.015em; margin: 18px 0 8px; color: var(--night); }
.card { background: var(--card); border-radius: var(--r-l); padding: 14px; margin: 0 0 12px; box-shadow: var(--e1); }
.card.flush { padding: 0; overflow: hidden; }
.card h2 { font: 800 17px/1.2 var(--display); letter-spacing: -.01em; }
.sub, .card .sub { font-size: 14px; color: var(--muted); }
.cardlink { display: block; color: inherit; text-decoration: none; }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 13px 14px 9px; }
.accent { border-top: 4px solid var(--tc); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 10px 16px; border-radius: var(--r-m); border: 2px solid var(--navy); background: var(--navy); color: #fff; font: 800 17px/1.15 var(--display); letter-spacing: -.01em; text-decoration: none; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(.985); filter: brightness(.94); }
.btn.sec2 { background: #fff; color: var(--navy); border-color: #c5d3df; }
.btn.danger { background: #fff; color: var(--err); border-color: var(--err); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btnrow { display: grid; gap: 10px; margin-top: 12px; }
.note { border-radius: var(--r-m); padding: 10px 12px; font-size: 15px; margin: 0 0 12px; border-left: 4px solid transparent; }
.note.info { background: var(--info-bg); border-color: var(--sky); }
.note.warn { background: var(--warn-bg); border-color: var(--sun); color: #4f2c00; }
.note.err { background: var(--err-bg); border-color: var(--err); color: #5f130e; }
.note.ok { background: var(--ok-bg); border-color: var(--ok); color: #0d3f25; }
.note strong { display: block; }
.empty { text-align: center; color: var(--muted); padding: 22px 14px; box-shadow: none; background: transparent; border: 1.5px dashed #c5d3df; }
.pill, .badge { display: inline-block; font-size: 13px; font-weight: 700; line-height: 1.3; padding: 2px 9px; border-radius: 10px; background: var(--soft); color: #24404f; margin-top: 5px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn, .pill.warn { background: var(--warn-bg); color: var(--warn); } .badge.out { background: #e9edf1; color: #47545f; }
details { margin-top: 4px; } summary { min-height: 46px; box-sizing: border-box; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
ul.plain { margin: 6px 0 0; padding-left: 18px; font-size: 15px; } ul.plain li { margin: 4px 0; }
progress { width: 100%; height: 6px; margin: 8px 0 4px; accent-color: var(--tc); }
.rules h2 { margin-bottom: 6px; }
.rl { list-style: none; margin: 0; padding: 0; }
.rl li { display: flex; gap: 8px; font-size: 15px; padding: 3px 0; }
.rl .mk { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }
.rl.ok .mk { background: var(--ok-bg); color: var(--ok); } .rl.todo .mk { background: var(--warn-bg); color: var(--warn); }
.foot { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; font-size: 13px; color: #5f6b78; }
.foot p { margin: 4px 0; }
.foot .ig { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; color: var(--navy); font-weight: 600; text-decoration: none; }
.foot .credit { color: #6a7683; }

/* ============ 6. CLASSIFICA ============ */
table.st { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.st th { font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; padding: 4px 2px 6px; border-bottom: 1px solid var(--line); }
table.st th.l, table.st td.l { text-align: left; }
table.st td { padding: 10px 2px; text-align: center; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--muted); font-size: 15px; }
table.st td.l { color: var(--ink); vertical-align: top; padding-top: 12px; }
table.st tr:last-child td { border-bottom: 0; }
table.st .c-pos { width: 50px; } table.st .c-n { width: 32px; } table.st .c-pt { width: 52px; } table.st .c-dg { width: 44px; }
table.st th.c-pos, table.st td.c-pos { padding-left: 12px; text-align: left; }
table.st td.c-pos, table.st td.c-pt { vertical-align: top; }
/* posizione: numero grande; nella zona qualificazione prende il colore del torneo */
.rk { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 4px; border-radius: var(--r-s); background: var(--paper); color: var(--ink); font: 800 17px/1 var(--display); }
tr.zone .rk { background: var(--tc); color: #fff; }
tr.zone2 .rk { background: var(--tc-bg); color: var(--tc); box-shadow: inset 0 0 0 1.5px var(--tc); }
tr.cut td { border-bottom: 2px solid var(--tc); }
/* punti: la cifra che conta, in cella da segnapunti */
.ptv { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 32px; padding: 0 6px; border-radius: var(--r-s); background: var(--night); color: #fff; font: 800 18px/1 var(--display); }
table.st tr.wd td.l, table.st tr.wd .rk { color: var(--muted); } table.st tr.wd .ptv { background: #7d8b99; }
table.st.unoff th.l, table.st.unoff td.l { padding-left: 14px; }
.rowbtn { all: unset; display: block; width: 100%; cursor: pointer; box-sizing: border-box; min-height: 32px; }
.rowbtn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.team { font-weight: 700; }
.team .pl { display: inline-block; max-width: 100%; vertical-align: top; }
.team .sep { color: var(--muted); font-weight: 400; }
.more { font-size: 14px; color: var(--muted); font-weight: 400; margin-top: 6px; }
.more div { margin-top: 2px; }
.legend { font-size: 13px; color: var(--muted); padding: 9px 14px 12px; border-top: 1px solid var(--line); }
.legend .key { display: inline-block; width: 14px; height: 14px; border-radius: 4px; background: var(--tc); vertical-align: -2px; margin-right: 4px; }
.legend .key.k2 { background: var(--tc-bg); box-shadow: inset 0 0 0 1.5px var(--tc); }

/* ============ 7. INCONTRI ============ */
.match { border-top: 1px solid var(--line); padding: 12px 14px; }
.match:first-child { border-top: 0; }
.ctx { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
/* segnapunti: la coppia vincente ha la barra gialla e le celle piene */
.sc { display: grid; grid-template-columns: minmax(0, 1fr) 36px 36px 42px; gap: 5px 5px; align-items: center; }
.sc.nostb { grid-template-columns: minmax(0, 1fr) 36px 36px; }
.sc .hd { font-size: 13px; color: var(--muted); text-align: center; line-height: 1; }
.sc .nm { position: relative; font-size: 16px; padding-left: 11px; color: #3a4a5c; }
.sc .nm .team { font-weight: 500; }
.sc .nm::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: var(--line); }
.sc .nm.win { color: var(--ink); } .sc .nm.win .team { font-weight: 800; }
.sc .nm.win::before { background: var(--sun); }
.sc .nm .tick { display: none; } /* la vincitrice si riconosce da barra gialla, grassetto e celle piene; per i lettori di schermo resta il testo */
.sc .g { display: flex; align-items: center; justify-content: center; height: 36px; border-radius: var(--r-s); background: var(--paper); color: #5b6b7d; font: 800 19px/1 var(--display); }
.sc .g.win { background: var(--night); color: #fff; }
.sc .g.stb { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px #c5d3df; font-size: 16px; }
.sc .g.stb.win { background: var(--sun); color: var(--night); box-shadow: none; }
.match .meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.mrow .meta { margin-top: 0; }
.mshare { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -8px; border-radius: 50%; color: var(--navy); }
.mshare:active { background: var(--soft); }
.round.final .mshare { color: var(--sun); }
.mlink { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 2px; color: var(--navy); font-weight: 700; font-size: 15px; text-decoration: none; }
/* da giocare: nessuna cella, non può sembrare un risultato */
.vs { font-size: 16px; font-weight: 600; display: grid; gap: 3px; }
.vs .team { position: relative; padding-left: 11px; }
.vs .team::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 4px; border-radius: 2px; background: var(--line); }
.vs .x { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot .lab { font-size: 14px; color: var(--muted); }
.slot .who { font-weight: 700; text-align: right; }
.slot .who.tbd { font-weight: 400; color: var(--muted); white-space: nowrap; }

/* ============ 8. HOME ============ */
.hero { position: relative; overflow: hidden; background: var(--night); color: #fff; border-radius: var(--r-l); padding: 16px 16px 14px; margin-bottom: 12px; box-shadow: var(--e2); }
/* le righe di un campo da padel, appena accennate */
.hero::before { content: ""; position: absolute; right: -34px; top: -30px; width: 190px; height: 250px; border: 2px solid rgba(255,255,255,.10); border-radius: 6px; transform: rotate(14deg);
  background: linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)) 0 50% / 100% 2px no-repeat, linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)) 50% 0 / 2px 28% no-repeat, linear-gradient(rgba(255,255,255,.10), rgba(255,255,255,.10)) 50% 100% / 2px 28% no-repeat; }
.hero > * { position: relative; }
.hero-k { font-size: 14px; color: #b8cee2; }
.hero-n { font: 800 34px/1.05 var(--display); letter-spacing: -.03em; margin-top: 2px; }
.hero-n small { font: 600 15px/1.2 var(--text); letter-spacing: 0; color: #d6e3ef; margin-left: 6px; }
.seg { display: flex; gap: 4px; margin-top: 12px; }
.seg span { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
.seg span i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--sun); }
.tiles { list-style: none; margin: 0 0 6px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 10px; width: 100%; min-height: 96px; padding: 12px 12px 12px; background: #fff; color: var(--ink); border: 0; border-radius: var(--r-l); box-shadow: var(--e1); text-decoration: none; cursor: pointer; text-align: left; overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tc); }
.tile:active { transform: scale(.98); }
.tile .ticon { grid-row: span 2; }
.tile .tn { font: 800 19px/1.1 var(--display); letter-spacing: -.02em; align-self: end; }
.tile .tp { font-size: 13px; color: var(--muted); align-self: start; }
.tile progress { grid-column: 1 / -1; margin: 6px 0 0; }
.tiles.small { margin-bottom: 12px; } .tiles.small .tile { min-height: 72px; }
.tile[aria-pressed="true"] { background: var(--tc-bg); box-shadow: inset 0 0 0 2px var(--tc); }
.lead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
.lead:first-child { border-top: 0; }
.lead .lg { font-size: 13px; color: var(--muted); }
.lead .ticon { grid-row: span 2; }
.fix { color: inherit; text-decoration: none; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.fix:first-child { border-top: 0; }
.fix .when { text-align: center; background: var(--paper); border-radius: var(--r-s); padding: 5px 2px; font-size: 13px; color: var(--muted); line-height: 1.2; }
.fix .when b { display: block; font: 800 16px/1.1 var(--display); color: var(--night); }
.finals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; list-style: none; margin: 0; padding: 0; }
.finals a { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; background: #fff; border-radius: var(--r-m); box-shadow: var(--e1); color: var(--ink); font-weight: 700; text-decoration: none; }
.finals a::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); }

/* ============ 9. FASE FINALE ============ */
.ponav { display: flex; gap: 6px; margin: 0 0 4px; padding: 0; list-style: none; counter-reset: rnd; }
.ponav li { flex: 1 1 0; min-width: 0; counter-increment: rnd; }
.ponav button { width: 100%; min-height: 48px; border: 0; border-radius: var(--r-m); background: #fff; box-shadow: var(--e1); font-size: 13px; font-weight: 700; line-height: 1.15; color: var(--ink); cursor: pointer; padding: 4px 4px; }
.ponav button::before { content: counter(rnd); display: block; font: 800 15px/1.1 var(--display); color: var(--terra); }
.round .sec { display: flex; align-items: center; gap: 8px; scroll-margin-top: 80px; }
.rmatches { display: grid; gap: 10px; }
.pm { background: #fff; border-radius: var(--r-l); box-shadow: var(--e1); padding: 4px 0; border-top: 0; overflow: hidden; }
.pm.match { padding: 10px 14px; }
.pm .slot { padding: 9px 0; }
.pm .pill { margin: 2px 0 6px; }
.bye { display: inline-block; margin-left: 6px; font-size: 13px; font-weight: 700; color: var(--terra); }
.round.final .pm { background: var(--night); color: #fff; box-shadow: var(--e2), inset 0 0 0 2px var(--sun); padding: 14px 16px; }
.round.final .slot { border-color: rgba(255,255,255,.16); }
.round.final .slot .lab, .round.final .meta, .round.final .who.tbd, .round.final .sc .hd { color: #b8cee2; }
.round.final .sc .nm { color: #d6e3ef; } .round.final .sc .nm.win { color: #fff; } .round.final .sc .nm::before { background: rgba(255,255,255,.2); } .round.final .sc .nm.win::before { background: var(--sun); }
.round.final .sc .g { background: rgba(255,255,255,.12); color: #d6e3ef; } .round.final .sc .g.win { background: var(--sun); color: var(--night); }
.round.final .sc .g.stb { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); }
.round.final .mlink, .round.final .team .sep { color: var(--sun); }
.round.final .pill { background: rgba(255,255,255,.14); color: #fff; }
.champ { background: var(--night); color: #fff; text-align: center; box-shadow: var(--e2), inset 0 0 0 2px var(--sun); padding: 18px 14px; }
.champ .lab { font-size: 14px; color: var(--sun); font-weight: 700; } .champ .team { font: 800 24px/1.15 var(--display); letter-spacing: -.02em; } .champ .team .sep { color: var(--sun); }

/* ============ 10. MODULI, INSERIMENTO, GESTIONE ============ */
label.f { display: block; font-weight: 600; margin: 12px 0 6px; }
.in { width: 100%; min-width: 0; max-width: 100%; min-height: 52px; padding: 10px 12px; border: 1.5px solid #9aabba; border-radius: var(--r-m); background: #fff; font-size: 17px; }
.in:focus { border-color: var(--navy); }
textarea.in { min-height: 96px; }
select.in { appearance: auto; }
/* segnapunti in diretta: resta visibile mentre si compila */
.live { position: sticky; top: 70px; z-index: 5; background: var(--night); color: #fff; border-radius: var(--r-m); padding: 6px 12px 8px; margin-bottom: 12px; box-shadow: var(--e2); }
.live .sc .nm { color: #d6e3ef; } .live .sc .nm.win { color: #fff; } .live .sc .nm::before { background: rgba(255,255,255,.2); } .live .sc .nm.win::before { background: var(--sun); }
.live .sc .hd { color: #b8cee2; }
.live .sc { gap: 4px 5px; } .live .sc .g { height: 30px; font-size: 17px; } .live .sc .nm { font-size: 15px; }
.live .sc .g { background: rgba(255,255,255,.12); color: #fff; } .live .sc .g.win { background: var(--sun); color: var(--night); } .live .sc .g.empty { color: rgba(255,255,255,.35); }
.live .sc .g.stb { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); color: #fff; }
.step { display: flex; align-items: center; gap: 8px; font: 800 17px/1.2 var(--display); letter-spacing: -.01em; color: var(--night); margin-bottom: 6px; }
.card[data-done="1"] > .step::after { content: "✓"; margin-left: auto; width: 24px; height: 24px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
.q { font-weight: 600; margin: 10px 0 8px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { width: 100%; min-height: 58px; border: 1.5px solid #9aabba; background: #fff; border-radius: var(--r-m); font-weight: 700; padding: 6px 8px; cursor: pointer; font-size: 16px; transition: transform .1s ease, background-color .1s ease; }
.opt:active { transform: scale(.96); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid.five { grid-template-columns: repeat(5, 1fr); }
.grid .opt { font: 800 19px/1 var(--display); padding: 4px; }
.opt[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
.opt[aria-pressed="true"] .sep, .chip[aria-pressed="true"] .sep { color: inherit; }
.stepper { display: grid; grid-template-columns: 58px 1fr 58px; gap: 8px; align-items: center; text-align: center; font: 800 24px/1 var(--display); margin-top: 10px; }
.stepper button { min-height: 58px; border: 1.5px solid #9aabba; background: #fff; border-radius: var(--r-m); font-size: 24px; font-weight: 700; }
.mitem { display: block; width: 100%; text-align: left; background: #fff; border: 0; border-top: 1px solid var(--line); padding: 14px; min-height: 60px; cursor: pointer; font-weight: 600; }
.mitem:first-child { border-top: 0; }
.mitem:active { background: var(--paper); }
.mitem .st2 { font-size: 14px; color: var(--muted); margin-top: 2px; font-weight: 400; }
.menu { display: grid; gap: 8px; }
.menu .mitem { border: 0; border-radius: var(--r-m); box-shadow: var(--e1); font-size: 17px; position: relative; padding-right: 34px; }
.menu .mitem::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -5px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 16px; margin: 10px 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; text-align: right; }
.log { font-size: 14px; border-top: 1px solid var(--line); padding: 10px 14px; }
.log:first-child { border-top: 0; }
.log .when { color: var(--muted); }
.rolebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--night); color: #fff; border-radius: var(--r-m); padding: 6px 6px 6px 14px; margin-bottom: 12px; font-size: 14px; }
.rolebar strong { font: 800 16px/1.2 var(--display); }
.rolebar button { min-height: 44px; padding: 4px 14px; border: 0; background: rgba(255,255,255,.14); color: #fff; border-radius: 22px; font-weight: 700; cursor: pointer; }
.navadmin { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.navadmin .chip { flex: 1 1 auto; position: relative; padding: 6px 10px; font-size: 15px; border-radius: var(--r-m); }
.navadmin .chip .bbadge { top: -6px; right: -4px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; min-height: 44px; }
.check input, .perm input { width: 26px; height: 26px; flex: none; margin-top: 1px; accent-color: var(--navy); }
.perm { display: flex; cursor: pointer; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); min-height: 44px; }
.perm:first-child { border-top: 0; }
.perm .lock { font-size: 13px; color: var(--muted); display: block; }
.codebox { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; background: var(--paper); border: 1.5px dashed var(--navy); border-radius: var(--r-m); padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }
.diff { font-size: 15px; } .diff .chg { background: var(--warn-bg); border-radius: 6px; padding: 0 4px; font-weight: 700; }
.exp { padding: 10px; }
.exp img { display: block; width: 100%; height: auto; border-radius: var(--r-m); box-shadow: var(--e2); }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 10px; }
@media (min-width: 480px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.card > .step + .sub { margin-bottom: 4px; }
.wrap > .step { margin-top: 10px; }

/* ============ 11. STATI E MOVIMENTO ============ */
.skel { background: linear-gradient(90deg, #e1e7ed 25%, #edf1f5 37%, #e1e7ed 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: var(--r-l); height: 72px; margin-bottom: 12px; }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
/* un solo movimento d'ingresso, al cambio di pagina */
.enter { animation: enter .18s ease-out both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* conferma: il messaggio di esito entra una volta */
.note.ok, .note.err { animation: pop .22s ease-out both; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ============ 12. SCHERMI LARGHI ============ */
@media (min-width: 600px) {
  .wrap { padding: 20px 20px 112px; }
  .httl .title { font-size: 21px; }
  .hlogo img { height: 56px; }
  .h1 { font-size: 30px; }
  .bbar { grid-template-columns: 110px minmax(0, 320px) 110px; justify-content: center; }
  .bbar.n2 { grid-template-columns: 200px 200px; } .bbar.n3.nomain { grid-template-columns: 180px 180px 180px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .chips.four { display: inline-flex; } .chips.four > * { flex: 0 0 auto; } .chips.four .chip { padding: 5px 20px 4px; } .chips.four > .chip { width: auto; }
  .chips.tabs { grid-template-columns: repeat(3, max-content); } .chips.tabs .chip { padding: 6px 20px; }
  .btnrow.two { grid-template-columns: 1fr 1fr; }
  .navadmin .chip { flex: 0 0 auto; padding: 6px 18px; }
  .finals { grid-template-columns: repeat(4, 1fr); }
  .hero { padding: 22px 24px 20px; } .hero-n { font-size: 44px; }
}
@media (min-width: 900px) {
  .wrap { max-width: 1040px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  /* tabellone completo: una colonna per turno, verso la finale */
  .ponav { display: none; }
  .bracket { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 18px; align-items: stretch; }
  .round { display: flex; flex-direction: column; }
  .rmatches { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
}

/* ===== V3: overlay, intestazione torneo, condivisione in alto, sponsor, tabellone guidato ===== */
html.ovl-open { overflow: hidden; }
.ovl { position: fixed; inset: 0; z-index: 80; background: rgba(4, 30, 54, .62); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
.ovl-box { background: var(--card); color: var(--ink); width: 100%; max-width: 560px; max-height: 92vh; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(4, 30, 54, .35); outline: none; }
.ovl-box.wide { max-width: 760px; }
.ovl-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.ovl-head h2 { flex: 1; margin: 0; font-size: 1.15rem; }
.ovl-x { min-width: 44px; min-height: 44px; border: 0; border-radius: 12px; background: var(--soft); color: var(--ink); font-size: 1.1rem; font-weight: 700; cursor: pointer; }
.ovl-body { padding: 14px 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
.ovl-body .card { box-shadow: none; border: 0; padding: 0; margin: 0; }
.ovl-foot { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 0; }
@media (min-width: 700px) { .ovl { align-items: center; padding: 24px; } .ovl-box { border-radius: 22px; } }
.ptitle { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.ptitle .h1 { flex: 1; margin: 0; min-width: 0; }
.rulebtn { flex: none; box-sizing: border-box; min-width: 46px; min-height: 46px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 1.25rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.topshare { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 700; text-decoration: none; margin: 0 0 10px; }
.sc .nm .tick.cup { display: inline; font-size: .95em; margin-left: 4px; }
.cmp { width: 100%; border-collapse: collapse; font-size: .92rem; margin: 6px 0 12px; }
.cmp th, .cmp td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp thead th { font-size: .82rem; color: var(--muted); font-weight: 700; }
.cmp td.chg { background: #fff2d2; font-weight: 700; }
.cmp .q { font-size: .82rem; color: var(--muted); }
.linkrow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.linkrow:last-child { border-bottom: 0; }
.linkrow .lk { min-width: 0; } .linkrow .lk strong { display: block; } .linkrow .lk span { display: block; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.mini { min-height: 44px; padding: 0 14px; font-size: .9rem; width: auto; }
.sprow { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.splogo { width: 96px; height: 64px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.sponsor { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--muted); font-size: .85rem; }
.sponsor img { height: 44px; max-width: 150px; object-fit: contain; background: #fff; border-radius: 10px; padding: 4px 8px; border: 1px solid var(--line); }
.pomatch { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 8px 0; }
.pomatch .pid { font-weight: 800; margin-bottom: 6px; }
.popreview li { padding: 4px 0; }
.savedbox .btnrow { grid-template-columns: 1fr; }
@media (min-width: 520px) { .savedbox .btnrow { grid-template-columns: repeat(3, 1fr); } }

/* inserimento rapido */
.qrow { margin: 8px 0 10px; } .qn { font-weight: 700; margin-bottom: 5px; }
.qgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; } .qgrid.ten { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.qgrid .opt { min-height: 48px; padding: 2px; font: 800 17px/1 var(--display); border-radius: 12px; }
.opt.tl { display: flex; flex-direction: column; align-items: flex-start; text-align: left; min-height: 56px; gap: 2px; margin-bottom: 6px; } .opt.tl .sm { font-size: 13px; font-weight: 500; opacity: .75; }
.menu.tight { display: block; } .qdate { margin: 8px 0; } .qdate summary { cursor: pointer; font-size: 14px; color: var(--muted); padding: 8px 0; min-height: 44px; display: flex; align-items: center; }

/* ============ 13. COMPATTEZZA SPORTIVA (sprint UX 16/11) ============
 * Meno cornici e ombre, bordi sottili, spazi verticali ridotti; bersagli tattili sempre ≥ 44 px. */
:root { --r-l: 14px; --r-m: 10px; --tap: 44px;
  --e1: 0 1px 2px rgba(5,56,99,.06), 0 4px 10px -8px rgba(5,56,99,.25); --e2: 0 8px 20px -12px rgba(4,42,75,.45); }
.top { min-height: 56px; padding: 4px 10px 7px; gap: 8px; }
.hlogo img { height: 42px; } .hlogo, .hbtn { min-height: 44px; min-width: 44px; }
.httl .title { font-size: 16px; }
.wrap { padding: 10px 12px 96px; }
.card { padding: 12px; margin: 0 0 10px; box-shadow: var(--e1); }
.card h2 { font-size: 16px; }
.btn { min-height: 48px; padding: 8px 14px; font-size: 16px; border-width: 1.5px; }
.chip { min-height: 44px; padding: 4px 14px; border-width: 1px; }
.chip.ic { min-height: 50px; }
.opt { min-height: 50px; border-width: 1px; border-color: #b4c2cf; padding: 5px 8px; }
.opt.tl { min-height: 52px; margin-bottom: 5px; }
.tiles { gap: 8px; } .tile { min-height: 78px; padding: 10px; box-shadow: var(--e1); }
.tile .tn { font-size: 17px; } .tiles.small .tile { min-height: 60px; }
.hero { padding: 12px 14px 10px; margin-bottom: 10px; box-shadow: var(--e2); } .hero-n { font-size: 30px; }
.menu { gap: 6px; } .menu .mitem { font-size: 16px; min-height: 48px; }
.bitem { min-height: 48px; }
.bitem.main { box-shadow: 0 4px 10px -6px rgba(178,84,51,.7); }
.qgrid .opt { min-height: 44px; }

/* ---- Riepilogo classifiche ---- */
.sitbtn { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 14px; margin: 0 0 10px; border-radius: var(--r-m); background: var(--terra); color: #fff; text-decoration: none; font: 800 16px/1.1 var(--display); letter-spacing: -.01em; box-shadow: 0 4px 10px -6px rgba(178,84,51,.7); }
.sitbtn:active { transform: scale(.985); } .sitbtn .go { margin-left: auto; font-size: 22px; line-height: 1; }
.sitt { margin: 14px 0 4px; scroll-margin-top: 70px; }
.sithead { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding-left: 8px; border-left: 4px solid var(--tc); }
.sithead h2 { font: 800 19px/1.1 var(--display); letter-spacing: -.02em; }
.sithead .sub { margin-left: auto; font-size: 13px; }
.sitlink { font-size: 14px; font-weight: 700; color: var(--navy); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; padding-left: 6px; }
.rcbar { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
.rcwhen { font-size: 14px; font-weight: 700; color: var(--navy); } .rcwhen.warn { color: #9b4a00; }
.rcrefresh { margin-left: auto; width: auto; min-height: 44px; padding: 4px 14px; }
.rcact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 8px; } .rcact .btn { min-height: 46px; padding: 4px 10px; }

/* ---- UX2: elenchi compatti, nomi su una riga, riepiloghi per torneo, anteprime ---- */
.match { padding: 4px 14px 10px; }
.mhead { display: flex; align-items: center; gap: 6px; min-height: 44px; }
.mhead .ctx { flex: 1 1 auto; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mhead .ctx .ctxt { overflow: hidden; text-overflow: ellipsis; }
.mhead .mdate { flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; }
.mhead .mshare { margin-right: -10px; }
.sc .nm { display: flex; align-items: center; min-width: 0; cursor: pointer; }
.sc .nm .team, table.st td.l .team, .opt.tl .team { display: block; min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc .nm .team .pl, table.st td.l .team .pl, .opt.tl .team .pl { display: inline; }
.sc .nm.full .team { white-space: normal; overflow: visible; }
.sc .nm .tick.cup { flex: none; }
.sithead h2 { text-transform: none; }
.sitt .sithead { background: linear-gradient(90deg, var(--tc-bg), rgba(255,255,255,0) 75%); border-radius: 0 var(--r-m) var(--r-m) 0; padding: 4px 8px; }
.pobtn { margin: 4px 0 8px; min-height: 46px; }
.chips.five .chip { flex: 1 1 auto; justify-content: center; }
.exp img { display: block; width: auto; max-width: 100%; height: auto; max-height: min(64vh, 560px); margin: 0 auto 10px; border-radius: 10px; box-shadow: var(--e1); }
.exp img.pick { cursor: pointer; -webkit-user-drag: none; user-select: none; } .exp img.pick.drag { touch-action: none; cursor: grab; }
@media (min-width: 900px) { .expgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
.sithead h2 { white-space: nowrap; font-size: 18px; } .sithead .sub, .sitlink { white-space: nowrap; }
.chips.five { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.chips.five .chip { padding: 4px 6px; min-width: 0; }
@media (max-width: 420px) { .chips.five { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---- Editor foto della card (solo schermo, mai nel PNG) ---- */
.pickwrap { position: relative; width: fit-content; max-width: 100%; margin: 0 auto 10px; }
.pickwrap img.pick { margin: 0; }
.phadd { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; border: 2px dashed rgba(5,56,99,.45); border-radius: 12px; background: rgba(236,243,249,.92); color: var(--navy); font: inherit; cursor: pointer; text-align: center; }
.phadd strong { font: 800 16px/1.15 var(--display); } .phadd .phsub { font-size: 13px; color: var(--muted); }
.phadd .phic { position: relative; display: inline-flex; width: 58px; height: 58px; align-items: center; justify-content: center; border-radius: 50%; background: #fff; box-shadow: var(--e1); }
.phadd .phic b { position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: var(--terra); color: #fff; font: 800 18px/24px var(--display); }
.phadd:hover { background: rgba(225,236,246,.96); }
.phadd:focus-visible, .phbtn:focus-visible { outline: 3px solid var(--sun, #F2B705); outline-offset: 2px; }
.phtools { position: absolute; display: flex; justify-content: flex-end; gap: 6px; padding: 6px; pointer-events: none; }
.phbtn { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 12px; border: 0; border-radius: 22px; background: rgba(4,32,58,.82); color: #fff; font: 700 14px/1 var(--body, inherit); cursor: pointer; }
.phbtn.on { background: var(--terra); }
.pickwrap.moving img.pick { outline: 3px solid var(--terra); outline-offset: -3px; }
.phhint { margin: 6px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
.exp.updating img { opacity: .55; transition: opacity .15s; }
.phtools { flex-wrap: wrap; box-sizing: border-box; }
.phbtn { white-space: nowrap; font-size: 13px; padding: 4px 10px; gap: 5px; }
.pickwrap img.pick { display: block; width: 100%; height: auto; max-height: none; }

</style>
</head>

  function poll() {
    if (!A.data || !can('admin.read') || A.busy || A.loading || document.hidden) return;
    api.version().then(function (v) {
      if (!v || v.dataVersion === A.data.meta.dataVersion) return;
      return refresh().then(function () { if (A.view.name === 'manage') render(); else renderChrome(); });
    }).catch(function () { /* si riprova al prossimo giro */ });
  }
  document.addEventListener('visibilitychange', poll);
  setInterval(poll, 60000);
  root.PCPAdmin = {
    insert: function (tid, gid) { whenReady(function () { start('nuovo' + (tid ? '-' + U.tSlug(tid) + (gid ? '-' + U.gSlug(gid) : '') : '')); }); },
    propose: function (tid, gid) { whenReady(function () { start('proponi' + (tid ? '-' + U.tSlug(tid) + (gid ? '-' + U.gSlug(gid) : '') : '')); }); },
    manage: function () { whenReady(function () { start('gestione'); }); },
    open: function (hash) { whenReady(function () { start(hash || ''); }); }
  };
  if (root.PCP_ADMIN_LAZY) render(); else boot();
})(window);

</script>
<script>
/* Apertura diretta dell'area organizzatori (#nuovo, #nuovo-gold-a, #gestione) e, su Google, indirizzo condivisibile (?p=gold-a). */
(function () {
  function open(hash) { if (/^#?(nuovo|gestione|proponi)/.test(hash || '')) { window.PCPDemoShow('admin'); window.PCPAdmin.open(hash); } }
  var gs = window.google && window.google.script;
  if (gs && gs.url) {
    gs.url.getLocation(function (loc) { var p = (loc.parameter && loc.parameter.p) || loc.hash; if (p) { location.hash = '#' + String(p).replace(/^#/, ''); open(location.hash); } });
    window.addEventListener('hashchange', function () { var h = location.hash.replace(/^#/, ''); try { gs.history.replace(null, h && h !== 'home' ? { p: h } : {}, ''); } catch (e) { /* indirizzo non aggiornabile: si prosegue */ } });
  } else open(location.hash);
})();
</script>
